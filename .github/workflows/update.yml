name: Actualizar ankergames.json diariamente

on:
  schedule:
    # Se ejecuta todos los días a las 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña "Actions" en GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Necesario para poder guardar los cambios en el repositorio

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Node.js o Python (opcional si necesitas procesar datos)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar script de actualización
        run: |
          # Aquí puedes poner un script en Node.js, Python o comandos bash para modificar tu ankergames.json
          # Ejemplo rápido usando Node.js para actualizar una fecha o contenido:
          node -e '
            const fs = require("fs");
            const file = "ankergames.json";
            
            let data = {};
            if (fs.existsSync(file)) {
              data = JSON.parse(fs.readFileSync(file, "utf8"));
            }
            
            // MODIFICA AQUÍ LOS DATOS QUE NECESITES:
            data.ultimaActualizacion = new Date().toISOString();
            
            fs.writeFileSync(file, JSON.stringify(data, null, 2));
          '

      - name: Guardar y subir cambios al repositorio
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add ankergames.json
          git commit -m "Actualización automática diaria: ankergames.json" || echo "No hay cambios para confirmar"
          git push
